<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" class="handoff">
  <style>
    .handoff .cur { stroke: var(--c-route); }
    .handoff .new { stroke: var(--c-trajectory); stroke-dasharray: 700; stroke-dashoffset: 700; animation: hd-draw 6s var(--ease, ease) infinite; }
    .handoff .prefix { stroke: var(--c-safe); stroke-dasharray: 90; stroke-dashoffset: 90; animation: hd-prefix 6s linear infinite; }
    .handoff .drone { offset-path: path("M40 170 C120 120, 200 110, 300 150 C 380 182, 470 182, 600 110"); offset-rotate: 0deg; animation: hd-move 6s linear infinite; }
    .handoff .look { animation: hd-look 6s linear infinite; }
    .handoff .lbl { font: 600 13px var(--font-sans, sans-serif); fill: var(--ink-2); }
    @keyframes hd-move { from { offset-distance: 0%; } to { offset-distance: 100%; } }
    @keyframes hd-draw { 0%, 30% { stroke-dashoffset: 700; } 55%, 100% { stroke-dashoffset: 0; } }
    @keyframes hd-prefix { 0%, 25% { stroke-dashoffset: 90; } 45%, 100% { stroke-dashoffset: 0; } }
    @keyframes hd-look { 0%, 20% { opacity: 0; } 25%, 60% { opacity: 1; } 70%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .handoff * { animation: none !important; } .handoff .new { stroke-dashoffset: 0; } .handoff .prefix { stroke-dashoffset: 0; } }
  </style>
  <!-- current trajectory: ends at rest in known free space -->
  <path class="cur" d="M40 170 C120 120, 200 110, 300 150 C 380 182, 470 182, 560 140" fill="none" stroke-width="4" stroke-linecap="round"/>
  <circle cx="560" cy="140" r="6" fill="var(--c-route)"/>
  <!-- prefix kept from the current plan -->
  <path class="prefix" d="M212 112 C 240 112, 270 128, 300 150" fill="none" stroke-width="6" stroke-linecap="round"/>
  <!-- new trajectory, stitched at the look-ahead point -->
  <path class="new" d="M300 150 C 380 182, 470 182, 600 110" fill="none" stroke-width="4" stroke-linecap="round"/>
  <circle cx="600" cy="110" r="6" fill="var(--c-trajectory)"/>
  <!-- look-ahead marker -->
  <g class="look">
    <circle cx="300" cy="150" r="9" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <text class="lbl" x="300" y="200" text-anchor="middle">look-ahead point: new plan starts here</text>
  </g>
  <!-- vehicle -->
  <g class="drone">
    <circle r="10" fill="var(--c-vehicle)" stroke="var(--bg)" stroke-width="2"/>
  </g>
  <text class="lbl" x="40" y="40">current plan</text><rect x="118" y="32" width="26" height="4" fill="var(--c-route)"/>
  <text class="lbl" x="170" y="40">kept prefix</text><rect x="252" y="32" width="26" height="4" fill="var(--c-safe)"/>
  <text class="lbl" x="300" y="40">new plan</text><rect x="368" y="32" width="26" height="4" fill="var(--c-trajectory)"/>
</svg>
