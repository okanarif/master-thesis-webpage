id: flights
title: "Real Flights"
kicker: "Six indoor layouts, map empty at take-off"
text:
  - "Livox Mid-360 3D LiDAR, onboard computer and PX4 flight controller; state estimation from motion capture, everything else onboard."
  - "The map starts empty on every flight: the gray space in the inset is what the LiDAR has not seen yet."
text_numbers:   # rendered only with flags.show_flight_numbers
  - "Flights were limited to a low speed because the arena is small."

video:
  type: video_player          # served in-page; switch to `type: youtube` + `id:` if 4K via YouTube is wanted later
  src: assets/video/flights.mp4
  poster: assets/video/flights-poster.jpg
  alt: "Video of the six indoor flights, four camera views and a map inset."
  width: 1920
  height: 1080
  chapters:                   # labels follow the thesis layout names
    - { t: 0,   label: "Map 1", note: "Face-to-Face Obstacles" }
    - { t: 27,  label: "Map 2", note: "Wide-Radius & Wall Barriers" }
    - { t: 54,  label: "Map 3", note: "Non-Convex U-Shaped Trap" }
    - { t: 81,  label: "Map 4", note: "U-Shaped Trap Interior Escape" }
    - { t: 111, label: "Map 5", note: "S-Shaped Curved Corridor" }
    - { t: 122, label: "Map 6", note: "3D Multi-Altitude & Window Passage" }

grid:           # rendered only with flags.show_flight_grid (priority 2 asset)
  flag: show_flight_grid
  entries:
    - { id: map_1, label: "Map 1 · Face-to-Face Obstacles" }
    - { id: map_2, label: "Map 2 · Wide-Radius & Wall Barriers" }
    - { id: map_3, label: "Map 3 · Non-Convex U-Shaped Trap" }
    - { id: map_4, label: "Map 4 · U-Shaped Trap Interior Escape" }
    - { id: map_5, label: "Map 5 · S-Shaped Curved Corridor" }
    - { id: map_6, label: "Map 6 · 3D Multi-Altitude & Window Passage" }

platform:
  title: "The quadrotor"
  # Numbered list keyed to the markers on the first photo; the second photo has no markers.
  parts:
    - "Livox Mid-360 3D LiDAR, pitched down, inside a 3D-printed cage"
    - "Onboard computer: mapping, decomposition, frontier selection and planning run here"
    - "Flight controller running PX4, below the computer"
    - "Motion-capture markers: position only; the environment is sensed by the LiDAR"
  photos:
    - src: assets/img/photos/drone-main.jpg
      webp: assets/img/photos/drone-main.webp
      alt: "Side view of the quadrotor: a LiDAR under a printed cage on top, the onboard computer in the middle, motion-capture markers on two arms."
      caption: "Side view"
      markers:
        - { n: 1, x: 54, y: 24 }
        - { n: 2, x: 51, y: 52 }
        - { n: 3, x: 47, y: 63 }
        - { n: 4, x: 9,  y: 74 }
    - src: assets/img/photos/drone-detail.jpg
      webp: assets/img/photos/drone-detail.webp
      alt: "Front view of the quadrotor with all four propellers and the motion-capture markers visible; the LiDAR cage on top."
      caption: "Front view"
