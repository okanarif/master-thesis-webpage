id: simulation
title: "Simulation"
kicker: "Four benchmark maps"
text:
  - "Four benchmark maps, unknown at start, with the same arrival criteria for every planner."
  - "The four runs below play side by side; the dark area is space the LiDAR has not seen yet."
  - "The same maps were used to compare with SUPER and SANDO; quantitative results are part of ongoing research and not shared here."
limits:
  intro: "All simulation benchmarks ran under the same per-axis dynamic limits for every planner:"
  rows:
    - { label: "Velocity", value: "5.0 m/s" }
    - { label: "Acceleration", value: "20.0 m/s²" }
    - { label: "Jerk", value: "100.0 m/s³" }

video:
  type: video_player
  src: assets/video/sim.mp4
  webm: assets/video/sim.webm
  poster: assets/video/sim-poster.jpg
  alt: "Top-down simulation of four maps running in parallel: the occupancy map grows as the LiDAR sees more, safe boxes cover known free space, the trajectory follows a route around the obstacles."
  width: 1920
  height: 1080
  loop: true
  legend: [unknown, occupied, safe, route, trajectory]
  external: { label: "Watch in 4K on YouTube", href: "", external: true }   # filled once uploaded

maps:
  title: "The Four Maps"
  entries:
    - { src: assets/img/maps/map_1.png, webp: assets/img/maps/map_1.webp, alt: "Top-down view of map 1: a regular grid of cylinders.", label: "Map 1 · Regular Cylinder Grid" }
    - { src: assets/img/maps/map_2.png, webp: assets/img/maps/map_2.webp, alt: "Top-down view of map 2: a denser grid of larger cylinders.", label: "Map 2 · Dense Cylinder Grid" }
    - { src: assets/img/maps/map_3.png, webp: assets/img/maps/map_3.webp, alt: "Top-down view of map 3: U-shaped obstacles opening toward the start.", label: "Map 3 · Structured U-Shaped Traps" }
    - { src: assets/img/maps/map_4.png, webp: assets/img/maps/map_4.webp, alt: "Top-down view of map 4: deeper U-shaped obstacles with narrow gaps.", label: "Map 4 · Deep U-Shaped Traps & Narrow Gaps" }

comparison:
  title: "A Different Design Point"
  intro: "How this stack differs from two recent corridor planners. Qualitative only."
  columns: ["SUPER", "SANDO", "This stack"]
  column_refs: { "SUPER": super, "SANDO": sando }   # ids in references.yaml; "This stack" carries no citation
  rows:
    - { label: "Solver",               cells: ["L-BFGS (MINCO)", "Gurobi (MIQP)", "ACTOR (ADMM)"], refs: [~, ~, actor] }
    - { label: "Method",               cells: ["Spatio-temporal optimization over one corridor", "Mixed-integer quadratic program assigning segments to polytopes", "ADMM over a union of boxes; the assignment is a shortest path inside the iterations"] }
    - { label: "Objective",            cells: ["Minimum snap", "Minimum jerk", "Minimum snap"] }
    - { label: "Route Chosen",         cells: ["Before optimization, by a path search", "Before optimization, by a path search", "Inside the optimization, by the solver"] }
    - { label: "Corridor Constraints", cells: ["Soft penalties on the trajectory", "Hard constraints", "Hard constraints"] }
    - { label: "Binary Variables",     cells: ["None", "Yes, mixed-integer", "None"] }
    - { label: "Corridor Coverage",    cells: ["Along one path", "Along one path", "The whole local window"] }
    - { label: "Planner Node Does",    cells: ["Path plan, frontier, corridor along the path and trajectory, in sequence every cycle", "Path plan, frontier, corridor along the path and trajectory, in sequence every cycle", "Trajectory generation only; boxes and frontier arrive from the other nodes"] }
    - { label: "In Unknown Space",     cells: ["Exploratory plan plus a backup plan", "Corridors inside known free space", "Every plan ends at rest in known free space; no backup plan"] }

f3:   # approval-gated figure
  type: image
  flag: show_f3_topview_comparison
  src: assets/img/figures/topview-comparison.png
  webp: assets/img/figures/topview-comparison.webp
  alt: "Top-down trajectories of the three planners on the U-shaped maps."
  caption: "Top-down trajectories on the U-shaped maps; routes only, no numbers."
  width: 2400
  height: 1200
