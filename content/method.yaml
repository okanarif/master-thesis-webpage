id: method
title: "How it works"
kicker: "One architecture, five stages"
intro: "All figures share one legend. Unknown space is gray and is treated as an obstacle until the LiDAR sees it."
legend: [unknown, free, occupied, inflation, optimistic, safe, route, trajectory, goal, vehicle]

architecture:
  title: "System architecture"
  text:
    - "Perception, mapping, decomposition, frontier selection, planning and control run as separate ROS 2 nodes and exchange data through shared topics."
    - "Nothing upstream sits inside the planner's loop: the planner tick reads the latest safe boxes and frontier and only optimizes."
  media:
    type: image
    src: assets/img/figures/architecture.png
    webp: assets/img/figures/architecture.webp
    alt: "Block diagram: perception, mapping, decomposition, frontier selection, planner and action modules in a row, each publishing to and reading from a shared data layer holding the point cloud, occupancy grid, optimistic and safe corridors, frontier and trajectory reference."
    caption: "Parallel architecture of the stack: modules publish to and read from shared data; none waits for another."

steps:
  - id: mapping
    title: "Perception & mapping"
    text:
      - "A probabilistic occupancy grid with three states, free, occupied and unknown, is built from LiDAR scans as a sliding window around the vehicle."
      - "Unknown space stays an obstacle until the sensor sees it."
    media:
      type: image
      src: assets/img/figures/perception.png
      webp: assets/img/figures/perception.webp
      alt: "Four panels. A: the physical environment with the vehicle, three obstacles and the goal. B: LiDAR rays from the vehicle hitting the obstacle faces, leaving occluded regions behind them. C: the occupancy grid window with free cells, occupied cells and gray unknown wedges behind the obstacles. D: the same grid with inflation around occupied and unknown cells."
      caption: "(A) Environment, (B) LiDAR line of sight, (C) occupancy grid with free, occupied and unknown cells, (D) inflation around occupied and unknown cells."

  - id: decomposition
    title: "Map-wide decomposition"
    text:
      - "Instead of inflating a corridor along one path, the whole local window is decomposed into overlapping boxes, twice."
      - "Optimistic (unknown counts as free) to find routes; safe (unknown counts as occupied) to build the corridor."
    media:
      type: image
      src: assets/img/figures/decomposition.png
      webp: assets/img/figures/decomposition.webp
      alt: "Left: optimistic decomposition, light blue boxes covering known and unknown space. Right: safe decomposition, green boxes only in known free space, gray unknown space excluded."
      caption: "Optimistic pass (left) and safe pass (right) over the same window."
    schemas:
      - { svg: schema-corridor-path.svg, label: "Corridor along one path" }
      - { svg: schema-whole-window.svg, label: "Whole local window" }

  - id: frontier
    title: "Frontier selection"
    text:
      - "The optimistic route is projected onto the safe boxes; the deepest safe point becomes a terminal state with zero velocity."
      - "Every plan ends at rest in known free space, so no separate backup trajectory is needed."
    media:
      type: image
      src: assets/img/figures/frontier.png
      webp: assets/img/figures/frontier.webp
      alt: "Left: a route through the optimistic boxes toward a candidate goal. Right: the same route over the safe boxes, with the deepest safe point marked as the frontier target."
      caption: "Route through the optimistic boxes (left); deepest point inside the safe boxes becomes the target (right)."

  - id: solver
    title: "Trajectory optimization: the ACTOR solver"
    text:
      - "The solver assigns segments to boxes and optimizes the polynomial jointly by ADMM, so it can switch routes inside a single replan."
      - "Only the solver's role in the stack is shown here; the method is in the paper."
    link: { label: "Pries et al., IROS 2026", href: "https://arxiv.org/abs/2603.11335", external: true }
    media:
      type: video_loop
      flag: show_g1_loop
      src: assets/video/g1-route-switch.mp4
      webm: assets/video/g1-route-switch.webm
      poster: assets/img/posters/sim-map4-still.jpg
      alt: "Simulated run in front of a U-shaped obstacle: the planned trajectory switches to a route around the cavity within one replan."
      caption: "Route change in front of a U-shaped obstacle, simulation."
      width: 1280
      height: 720
      fallback:
        type: image
        src: assets/img/posters/sim-map4-still.jpg
        alt: "Simulated run on the map with deep U-shaped obstacles: safe boxes in green, the frontier route in orange and the planned trajectory leading around the cavity."
        caption: "Simulation on the map with deep U-shaped obstacles: safe boxes, frontier route and planned trajectory."

  - id: handoff
    title: "Replanning & trajectory hand-off"
    text:
      - "Each new plan starts from a predicted state on the current plan, so velocity and acceleration stay continuous."
      - "The planner module itself only generates trajectories: path search, frontier and corridor construction have already happened in the other nodes."
    media:
      type: video_loop
      src: assets/video/handoff.mp4
      webm: assets/video/handoff.webm
      poster: assets/video/handoff-poster.jpg
      alt: "Animation: the vehicle follows the current trajectory; a replan is triggered and its start state is taken a look-ahead time ahead; the solver runs while the vehicle keeps flying; the remaining prefix is attached in front of the new plan and the hand-off happens without a jump in the reference."
      caption: "Replanning with prefix stitching: the new plan starts at the look-ahead point and is stitched onto the kept prefix."
      width: 1280
      height: 720
    compare:
      title: "Planner module, side by side"
      entries:
        - src: assets/img/figures/planner-sequential.png
          webp: assets/img/figures/planner-sequential.webp
          alt: "Planner block of SUPER and SANDO: path plan, frontier selection at the end of the plan horizon, corridor generation along the path and trajectory generation, in sequence."
          label: "SUPER / SANDO"
          note: "path plan → frontier → corridor along the path → trajectory, every cycle"
        - src: assets/img/figures/planner-actor.png
          webp: assets/img/figures/planner-actor.webp
          alt: "Planner block of this stack: trajectory generation only."
          label: "This stack"
          note: "trajectory generation only; boxes and frontier arrive from the other nodes"
